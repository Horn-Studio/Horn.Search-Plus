<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Horn.Search Plus</title>  
    <style>  
        /* 新增时钟样式 */
        #clock {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 51px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            pointer-events: none;
        }

        .top-right-link {  
            position: absolute;  
            top: 10px;  
            right: 10px;  
            text-decoration: none;  
            color: #007bff;  
            font-size: 12px;  
            font-weight: bold;  
            padding: 5px 10px;  
            border-radius: 15px;  
            transition: background-color 0.3s;  
        }  

        .top-right-link:hover {  
            background-color: #e9ecef;  
        }
         
        body {  
            font-family: HarmonyOS Sans SC,Microsoft YaHei;  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            height: 100vh;  
            margin: 0;  
            background-color: #f0f0f0;  
            background-image: url('https://www.todaybing.com/api/today/cn');  
            background-size: cover;  
            background-repeat: no-repeat;  
        }  

        @media () {  
            body {  
                background-size: contain;  
            }  
        }

        .hidden {  
            display: none !important;  
        }  

        .fade-in {  
            opacity: 0;  
            animation: fadeIn 1s forwards;  
        }  

        body.hidden-elements .search-container {  
            display: none;  
        }

        @keyframes fadeIn {  
            from { opacity: 0; }  
            to { opacity: 0.85; }  
        }

        .search-container {  
            opacity: 1;  
            transition: opacity 0.5s ease-in-out;  
            width: 50%;  
            max-width: 600px;  
            padding: 30px;  
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2); 
            background-color: #fff;  
            border-radius: 30px;  
            display: flex;  
            flex-direction: column;  
            align-items: center;  
        }  

        input[type="text"] {  
            width: calc(100% - 110px);  
            padding: 10px;  
            margin-right: 10px;  
            border: 1px solid #ccc;  
            border-radius: 20px;  
            transition: background-color 0.3s;
        }  

        input[type="text"]:hover {  
            background-color: #e9ecef;  
        }

        button {  
            padding: 10px 20px;  
            background-color: #0078d4;  
            color: white;  
            border: none;  
            border-radius: 29px;  
            cursor: pointer;  
            transition: background-color 0.2s;
        }  

        button:hover {  
            background-color: #005a9e;  
        } 

        .baidu-link-container {  
            display: inline-block;  
            padding: 10px 10px;  
            border: 1px solid #ccc;  
            border-radius: 5px;  
            background-color: #f8f9fa;  
            margin-top: 20px;  
            text-align: center;  
            transition: background-color 0.3s;
        }  

        .baidu-link-container:hover {  
            background-color: #e9ecef;  
        }

        .baidu-link {  
            display: block;  
            color: #007bff;  
            text-decoration: none;  
        }  

        .search-engines {  
            margin-bottom: 5px;  
        }  

        .search-engines select {  
            padding: 5px;  
            margin-right: 10px;  
            border: 1px solid #ccc;  
            border-radius: 55px;  
            transition: background-color 0.3s;
        }  

        .search-engines select:hover {  
            background-color: #e9ecef;  
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #3d3a3a;
                --borderColor: #2c2c3a;
                --primary: #24acf2;
            }
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #efefef;
                --borderColor: #2c2c3a;
                --primary: #1bcfe7;
            }
        }

        .flex {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
    </style>  
</head>  
<body class="">
    <div id="clock"></div>

    <div class="search-container fade-in" style="transition: opacity 0.5s ease-out; opacity: 0;">
        <div class="search-engines">  
            <select id="searchEngine" onchange="changeSearchEngine()">  
                <option value="https://www.bing.com/search?q=">必应(默认)</option>  
                <option value="https://www.baidu.com/s?wd=">百度</option>  
                <option value="https://www.sogou.com/web?query=">搜狗</option>  
                <option value="https://www.so.com/s?q=">360</option>
                <option value="https://quark.sm.cn/s?q=">夸克</option>  
                <option value="https://so.toutiao.com/search?q=">今日头条</option>
                <option value="https://www.chinaso.com/newssearch/all/allResults?q=">中国搜索</option>
            </select>  
        </div>  
        <h1>Horn.Search Plus</h1> 
        <form id="searchForm" action="https://www.bing.com/search" method="get" target="_blank">  
            <input type="text" name="q" placeholder="输入网址或搜索内容…">  
            <button type="submit">搜索</button>  
        </form>  
        <div class="baidu-link-container">  
            <a href="https://horn-studio.github.io/WebSiteList/" class="baidu-link" title="访问百度主页">  
                🏞️<br> 网址大全 <span></span>  
            </a>  
        </div>
        <a href="https://github.com/Horn-Studio/Horn.Search-Plus" class="top-right-link">版本:1.0.4.Plus(2025年5月1日更新)</a>
    </div>

    <script>  
        // 实时时钟功能
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 搜索引擎修复
        function changeSearchEngine() {  
            const select = document.getElementById('searchEngine');  
            const form = document.getElementById('searchForm');  
            form.action = select.value;  
        }  

        // 自动隐藏逻辑
        let timer;  
        const hideAfter = 60000; 

        document.addEventListener('mousemove', resetTimer);  
        document.addEventListener('click', resetTimer);  
        document.addEventListener('keypress', resetTimer);  

        function resetTimer() {  
            clearTimeout(timer);  
            if (document.body.classList.contains('hidden-elements')) {  
                document.body.classList.remove('hidden-elements');  
            }  
            timer = setTimeout(hideElements, hideAfter);  
        }  

        function hideElements() {  
            document.body.classList.add('hidden-elements');  
            const searchContainers = document.querySelectorAll('.search-container');  
            searchContainers.forEach(container => {  
                container.style.transition = 'opacity 0.5s ease-out';  
                container.style.opacity = 0;  
            });  
        }  

        document.addEventListener('click', function() {  
            if (document.body.classList.contains('hidden-elements')) {  
                resetTimer();  
                document.body.classList.remove('hidden-elements');  
                const searchContainers = document.querySelectorAll('.search-container.hidden');  
                searchContainers.forEach(container => {  
                    container.classList.remove('hidden');  
                });  
            }  
        });  
    </script> 
</body>
</html>
